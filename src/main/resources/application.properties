# ===============================
# SISTEMA PDV OFFLINE
# ===============================

# Porta do servidor
server.port=8080
server.servlet.context-path=/

# Nome da aplicacao
spring.application.name=pdv-offline

# ===============================
# BANCO DE DADOS LOCAL (H2 - Offline)
# Arquivo salvo em ./data/pdvdb - funciona sem internet
# ===============================
spring.datasource.url=jdbc:h2:file:./data/pdvdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;AUTO_RECONNECT=TRUE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Console H2 (acessivel em /h2-console)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect
spring.jpa.properties.hibernate.format_sql=true

# ===============================
# SINCRONIZACAO
# URL do servidor central (deixe em branco para modo totalmente local)
# Quando definida, o sistema envia/recebe dados quando ha conexao
# ===============================
sync.server.url=
sync.enabled=true
sync.interval-ms=60000

# ===============================
# MODULO FISCAL
# modo: simulacao (padrao) - gera XML estruturado sem enviar para SEFAZ
# Para emissao real, configure certificado digital e SEFAZ
# ===============================
fiscal.modo=simulacao
fiscal.empresa.cnpj=00000000000100
fiscal.empresa.ie=000000000000
fiscal.empresa.nome=EMPRESA EXEMPLO LTDA
fiscal.empresa.fantasia=PDV OFFLINE
fiscal.empresa.endereco=RUA EXEMPLO, 100
fiscal.empresa.cidade=SAO PAULO
fiscal.empresa.uf=SP
fiscal.empresa.cep=01001000
fiscal.ambiente=homologacao

# Logging
logging.level.com.pdv=INFO
