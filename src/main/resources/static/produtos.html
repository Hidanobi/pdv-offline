<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PDV Offline - Produtos &amp; Estoque</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

<aside class="sidebar">
    <div class="logo">
        <h1>PDV OFFLINE</h1>
        <p>Sistema de Ponto de Venda</p>
    </div>
    <nav>
        <a href="index.html"><span class="icone">&#128202;</span> Dashboard</a>
        <a href="pdv.html"><span class="icone">&#128722;</span> PDV / Vendas</a>
        <a href="produtos.html" class="ativo"><span class="icone">&#128230;</span> Produtos &amp; Estoque</a>
        <a href="clientes.html"><span class="icone">&#128101;</span> Clientes</a>
        <a href="historico.html"><span class="icone">&#128196;</span> Hist&oacute;rico</a>
        <a href="fiscais.html"><span class="icone">&#128220;</span> Documentos Fiscais</a>
        <a href="sincronizacao.html"><span class="icone">&#128260;</span> Sincroniza&ccedil;&atilde;o</a>
    </nav>
</aside>

<main class="main-content">
    <div class="cabecalho-pagina">
        <h2>Produtos &amp; Estoque</h2>
        <button class="btn btn-primario" onclick="abrirModal()">+ Novo Produto</button>
    </div>

    <div class="tabela-wrapper">
        <div style="display:flex; gap:10px; margin-bottom:16px;">
            <input type="text" id="busca" placeholder="Buscar por nome..." oninput="buscarProdutos()" style="flex:1; padding:10px; border-radius:8px; border:1px solid #e0e0e0;">
            <button class="btn btn-secundario" onclick="carregarProdutos()">Todos</button>
        </div>
        <table id="tabela-produtos">
            <thead>
                <tr>
                    <th>C&oacute;d. Barras</th>
                    <th>Nome</th>
                    <th>Categoria</th>
                    <th>Pre&ccedil;o Venda</th>
                    <th>Estoque</th>
                    <th>M&iacute;nimo</th>
                    <th>A&ccedil;&otilde;es</th>
                </tr>
            </thead>
            <tbody></tbody>
        </table>
    </div>
</main>

<!-- MODAL PRODUTO -->
<div id="modal-produto" class="modal-overlay" style="display:none;">
    <div class="modal">
        <h3 id="modal-titulo">Novo Produto</h3>
        <input type="hidden" id="prod-id">
        <div class="grid-form">
            <div class="campo"><label>C&oacute;digo de Barras</label><input type="text" id="prod-cb"></div>
            <div class="campo"><label>Nome</label><input type="text" id="prod-nome"></div>
            <div class="campo"><label>Categoria</label><input type="text" id="prod-cat"></div>
            <div class="campo"><label>Pre&ccedil;o Venda (R$)</label><input type="number" step="0.01" id="prod-pv"></div>
            <div class="campo"><label>Pre&ccedil;o Custo (R$)</label><input type="number" step="0.01" id="prod-pc"></div>
            <div class="campo"><label>Estoque Atual</label><input type="number" id="prod-est"></div>
            <div class="campo"><label>Estoque M&iacute;nimo</label><input type="number" id="prod-min"></div>
            <div class="campo"><label>Unidade</label>
                <select id="prod-un">
                    <option value="UN">UN</option><option value="KG">KG</option>
                    <option value="LT">LT</option><option value="CX">CX</option>
                </select>
            </div>
            <div class="campo"><label>NCM</label><input type="text" id="prod-ncm"></div>
            <div class="campo"><label>Aliq. ICMS (%)</label><input type="number" step="0.01" id="prod-icms"></div>
        </div>
        <div class="modal-rodape">
            <button class="btn btn-secundario" onclick="fecharModal()">Cancelar</button>
            <button class="btn btn-primario" onclick="salvarProduto()">Salvar</button>
        </div>
    </div>
</div>

<script>
async function carregarProdutos() {
    const res = await fetch('/api/produtos');
    const produtos = await res.json();
    renderizarTabela(produtos);
}

async function buscarProdutos() {
    const nome = document.getElementById('busca').value;
    if (nome.length < 2) { carregarProdutos(); return; }
    const res = await fetch(`/api/produtos/buscar?nome=${nome}`);
    const produtos = await res.json();
    renderizarTabela(produtos);
}

function renderizarTabela(produtos) {
    const tbody = document.querySelector('#tabela-produtos tbody');
    tbody.innerHTML = produtos.map(p => {
        const estoqueBaixo = p.estoqueAtual <= p.estoqueMinimo;
        return `
        <tr>
            <td>${p.codigoBarras}</td>
            <td>${p.nome}</td>
            <td>${p.categoria || '-'}</td>
            <td>R$ ${parseFloat(p.precoVenda).toFixed(2)}</td>
            <td><span class="badge ${estoqueBaixo ? 'badge-erro' : 'badge-sucesso'}">${p.estoqueAtual}</span></td>
            <td>${p.estoqueMinimo}</td>
            <td>
                <button class="btn btn-secundario" style="padding:4px 10px;" onclick="editarProduto(${p.id})">Editar</button>
                <button class="btn btn-perigo" style="padding:4px 10px;" onclick="deletarProduto(${p.id})">Excluir</button>
            </td>
        </tr>`;
    }).join('');
}

function abrirModal() {
    document.getElementById('modal-titulo').textContent = 'Novo Produto';
    document.getElementById('prod-id').value = '';
    ['prod-cb','prod-nome','prod-cat','prod-pv','prod-pc','prod-est','prod-min','prod-ncm','prod-icms'].forEach(i => document.getElementById(i).value = '');
    document.getElementById('modal-produto').style.display = 'flex';
}

function fecharModal() {
    document.getElementById('modal-produto').style.display = 'none';
}

async function editarProduto(id) {
    const res = await fetch(`/api/produtos/${id}`);
    const p = await res.json();
    document.getElementById('modal-titulo').textContent = 'Editar Produto';
    document.getElementById('prod-id').value = p.id;
    document.getElementById('prod-cb').value = p.codigoBarras;
    document.getElementById('prod-nome').value = p.nome;
    document.getElementById('prod-cat').value = p.categoria || '';
    document.getElementById('prod-pv').value = p.precoVenda;
    document.getElementById('prod-pc').value = p.precoCusto || 0;
    document.getElementById('prod-est').value = p.estoqueAtual;
    document.getElementById('prod-min').value = p.estoqueMinimo;
    document.getElementById('prod-un').value = p.unidade || 'UN';
    document.getElementById('prod-ncm').value = p.ncm || '';
    document.getElementById('prod-icms').value = p.aliquotaIcms || 0;
    document.getElementById('modal-produto').style.display = 'flex';
}

async function salvarProduto() {
    const id = document.getElementById('prod-id').value;
    const produto = {
        codigoBarras: document.getElementById('prod-cb').value,
        nome: document.getElementById('prod-nome').value,
        categoria: document.getElementById('prod-cat').value,
        precoVenda: parseFloat(document.getElementById('prod-pv').value),
        precoCusto: parseFloat(document.getElementById('prod-pc').value) || 0,
        estoqueAtual: parseInt(document.getElementById('prod-est').value) || 0,
        estoqueMinimo: parseInt(document.getElementById('prod-min').value) || 0,
        unidade: document.getElementById('prod-un').value,
        ncm: document.getElementById('prod-ncm').value,
        aliquotaIcms: parseFloat(document.getElementById('prod-icms').value) || 0
    };

    const url = id ? `/api/produtos/${id}` : '/api/produtos';
    const method = id ? 'PUT' : 'POST';
    const res = await fetch(url, {
        method: method,
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(produto)
    });
    if (res.ok) {
        fecharModal();
        carregarProdutos();
    } else {
        alert('Erro ao salvar produto');
    }
}

async function deletarProduto(id) {
    if (confirm('Excluir este produto?')) {
        await fetch(`/api/produtos/${id}`, { method: 'DELETE' });
        carregarProdutos();
    }
}

carregarProdutos();
</script>
</body>
</html>
